[project]
name = "prompt-scanner-gateway"
version = "0.1.0"
description = "API gateway that audits LLM prompts for IP, PHI, PII and regulatory violations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "anthropic>=0.69",
    "pyyaml>=6.0",
    "python-multipart>=0.0.17",
    "structlog>=24.4",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
# Presidio/spaCy give better NER-based PII recall but have no cp314 wheels yet.
# The fast gate degrades gracefully to deterministic detectors when absent.
ner = ["presidio-analyzer>=2.2", "spacy>=3.8"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
