<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        width: 260px;
        margin: 0;
        padding: 14px 16px;
        color: #0b0b0b;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        margin-bottom: 8px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot.ok {
        background: #0ca30c;
      }
      .dot.bad {
        background: #d03b3b;
      }
      .dot.off {
        background: #898781;
      }
      a,
      button.link {
        font-size: 12.5px;
        color: #2a78d6;
        text-decoration: none;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: block;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Prompt Gateway Scanner</h1>
    <div class="row"><span id="enabledDot" class="dot off"></span><span id="enabledLabel">Checking…</span></div>
    <div class="row"><span id="gatewayDot" class="dot off"></span><span id="gatewayLabel">Checking gateway…</span></div>
    <button class="link" id="openOptions">Settings</button>
    <a id="openDashboard" href="#" target="_blank">Open dashboard ↗</a>
    <script src="popup.js"></script>
  </body>
</html>
