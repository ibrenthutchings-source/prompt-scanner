server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + WebSocket traffic to the gateway container so the SPA can
    # keep using relative /v1/... paths in production, exactly as it does
    # against the Vite dev proxy locally.
    location /v1/live {
        proxy_pass http://gateway:8000/v1/live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /v1/ {
        proxy_pass http://gateway:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
